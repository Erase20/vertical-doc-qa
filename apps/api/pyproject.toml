[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vertical-doc-qa-api"
version = "0.1.0"
description = "API and worker for the vertical document QA assistant"
requires-python = ">=3.10"
dependencies = [
  "aiofiles>=24.1.0,<25.0.0",
  "alembic>=1.14.0,<2.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "celery[redis]>=5.4.0,<6.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "pgvector>=0.3.6,<1.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "python-docx>=1.1.2,<2.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "PyMuPDF>=1.25.0,<2.0.0",
  "redis>=5.2.0,<6.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.25.0,<1.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
